<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype B – Proposal-First Meeting Scheduling</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --line:#dfe1e6; --text:#1f2430; --muted:#6b7280;
    --accent:#2f6fde; --accent-soft:#e8f0fd; --ok:#1f8a4c; --ok-soft:#e6f4ec;
    --warn:#b7791f; --warn-soft:#fdf4e3; --bad:#c0392b; --bad-soft:#fbeaea;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  header h1{font-size:17px;margin:0}
  header .sub{color:var(--muted);font-size:12px}
  .viewas{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .viewas span{color:var(--muted);font-size:12px;margin-right:4px}
  .chipbtn{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 12px;cursor:pointer;font-size:13px}
  .chipbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  main{max-width:1020px;margin:0 auto;padding:20px 24px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
  .card h2{font-size:15px;margin:0 0 10px}
  .card h3{font-size:14px;margin:0 0 6px}
  .muted{color:var(--muted)}
  .small{font-size:12px}

  /* Status bar */
  .status{display:flex;align-items:center;margin:4px 0 10px;flex-wrap:wrap;row-gap:6px}
  .step{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:16px;font-size:12.5px;color:var(--muted);background:#eef0f3;white-space:nowrap}
  .step .dot{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;background:#fff;border:1px solid var(--line)}
  .step.done{color:var(--ok);background:var(--ok-soft)}
  .step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
  .step.current{color:#fff;background:var(--accent);font-weight:600}
  .step.current .dot{background:#fff;color:var(--accent);border-color:#fff}
  .arrow{color:#b8bec9;margin:0 4px}
  .statusmsg{display:inline-block;padding:6px 10px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px}
  .statusmsg.final{background:var(--ok-soft);color:var(--ok)}
  .round{margin-left:8px;font-size:12px;color:var(--muted)}
  .team{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
  .member{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:5px 9px;background:#fafbfc}
  .member b{font-size:12.5px}

  /* Tabs */

  /* Local times */
  .times{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .lt{border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12.5px;background:#fafbfc}
  .lt b{font-weight:600}
  .lt.me{border-color:var(--accent);background:var(--accent-soft)}
  .lt.out{border-color:#e8c26a;background:var(--warn-soft)}
  .flag{color:var(--warn);font-weight:700;margin-left:3px}
  .icon{margin-left:3px}

  /* Slots */
  .slot{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}
  .slot-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .slot-title{font-weight:600}
  .big{font-size:16px;font-weight:600}
  .opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .opt{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;user-select:none}
  .opt input{margin:0}
  .opt.sel-prefer{border-color:var(--ok);background:var(--ok-soft)}
  .opt.sel-inconvenient{border-color:var(--warn);background:var(--warn-soft)}
  .opt.sel-cannot{border-color:var(--bad);background:var(--bad-soft)}
  .opt.disabled{opacity:.45;cursor:not-allowed}
  .nonework{margin-top:6px;border:1px dashed #c9ced8;border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:8px}

  .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .col{border-radius:6px;padding:8px 10px;min-height:56px}
  .col h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
  .col.p{background:var(--ok-soft)} .col.p h4{color:var(--ok)}
  .col.i{background:var(--warn-soft)} .col.i h4{color:var(--warn)}
  .col.c{background:var(--bad-soft)} .col.c h4{color:var(--bad)}
  .name{display:inline-block;background:#fff;border-radius:10px;padding:1px 8px;margin:2px 4px 2px 0;font-size:12.5px;border:1px solid rgba(0,0,0,.06)}

  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  input[type=datetime-local],input[type=date],select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
  button{font:inherit;cursor:pointer}
  .btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 12px}
  .btn:hover{background:#f7f8fa}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(.95)}
  .btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn.link{border:none;background:none;color:var(--accent);padding:4px 6px}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}

  .banner{border-radius:8px;padding:12px 14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .banner.alert{background:var(--warn-soft);border:1px solid #e8c26a}
  .banner.info{background:var(--accent-soft);border:1px solid #bcd1f6}
  .banner.okb{background:var(--ok-soft);border:1px solid #a9d8bc}
  .strike{text-decoration:line-through;color:var(--muted)}
  .error{color:var(--bad);font-size:12.5px;margin-top:6px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
  .sw{display:inline-block;width:14px;height:10px;border:1px solid var(--line);vertical-align:middle;margin-right:4px}
  .log{margin:0;padding-left:18px;font-size:12.5px;color:var(--muted)}
  .log li{margin-bottom:2px}
  .demo{border-style:dashed;background:#fbfbfc}
  .confirmed-box{border:2px solid var(--ok);border-radius:8px;padding:12px 14px;background:var(--ok-soft)}

  /* Date & time setup */
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .seg button{border:none;background:#fff;padding:7px 14px}
  .seg button.on{background:var(--accent);color:#fff}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:12px;color:var(--muted)}
  .setup-grid{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-top:12px}
  .daychips{display:flex;gap:4px}
  .daychip{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 9px;font-size:13px}
  .daychip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

  /* Availability grid */
  .gridwrap{overflow-x:auto;margin-top:8px}
  .grid{display:grid;user-select:none;-webkit-user-select:none;font-size:11.5px}
  .paint{touch-action:none}
  .gh{text-align:center;font-weight:600;padding:4px 2px;font-size:12px;border-bottom:1px solid var(--line)}
  .gh.clickable,.rl.clickable{cursor:pointer}
  .gh.clickable:hover,.rl.clickable:hover{color:var(--accent)}
  .rl{text-align:right;padding-right:8px;color:var(--muted);line-height:1;transform:translateY(-5px);white-space:nowrap}
  .cell{height:18px;border-left:1px solid var(--line);border-bottom:1px dotted #e6e8ec;background:#fff}
  .cell.hour{border-top:1px solid #d4d7dd}
  .paint .cell[data-ms]{cursor:pointer}
  .cell.out{background:repeating-linear-gradient(45deg,#fff,#fff 4px,#f3f4f6 4px,#f3f4f6 8px)}
  .cell.on{background:#58b37f}
  .cell.none{background:#eceef1}
  .cell .pl{position:absolute;left:3px;top:1px;font-size:10px;font-weight:700;color:#fff;background:var(--accent);border-radius:3px;padding:0 3px;line-height:14px}
  .cell.on.out{background:#4ea374}
  .opt-card{border-left:4px solid var(--accent)}
  .mapwrap{position:relative;overflow-x:auto}
  .maptip{display:none;position:absolute;z-index:5;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);width:220px;pointer-events:none}
  .mav:hover rect{stroke:var(--accent)}
  @media (max-width:820px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Prototype B – Proposal-First Meeting Scheduling</h1>
    <div class="sub">Medium-fidelity prototype · sample data only · no backend</div>
  </div>
  <div class="viewas" id="viewas"></div>
</header>
<main id="app"></main>

<script>
/* ---------------- Sample data (shared three-person example) ---------------- */
const PEOPLE = [
  { id:'seyed', name:'Seyed', city:'Seattle',        country:'USA',       tz:'America/Los_Angeles', pref:[8,18], organizer:true },
  { id:'ahmed', name:'Ahmed', city:'Melbourne',      country:'Australia', tz:'Australia/Melbourne', pref:[9,18] },
  { id:'luel',  name:'Luel',  city:'Washington, DC', country:'USA',       tz:'America/New_York',    pref:[9,19] },
];
const ORGANIZER = PEOPLE.find(p => p.organizer);
const MEETING = { title:'Team Project Sync' };
const SLOT_MIN = 30;                         // calendar step
const DAY_START = 7, DAY_END = 19;           // sun icon from 7:00 to 18:59 local
const LETTERS = ['A','B','C'];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WEEK_ORDER = [1,2,3,4,5,6,0];
const ANSWERS = {
  prefer:       { label:'Prefer' },
  inconvenient: { label:'Can Attend but Inconvenient' },
  cannot:       { label:'Cannot Attend' },
};
const STEPS = [
  { key:'setup',     label:'Select Dates & Times' },
  { key:'proposed',  label:'Proposed' },
  { key:'collecting',label:'Collecting Responses' },
  { key:'revised',   label:'Revised' },
  { key:'awaiting',  label:'Awaiting Confirmation' },
  { key:'confirmed', label:'Confirmed' },
];

/* ---------------- State ---------------- */
function freshState(){
  return {
    view: 'seyed',
    stage: 'setup',            // setup | proposed | collecting | revised | awaiting | confirmed
    round: 1,
    setup: { recurring:false, start:'2026-12-01', end:'2026-12-04', days:[2,3,4], repeat:'weekly', from:'06:00', to:'20:00', dur:60 },
    cells: [],                 // UTC ms of every calendar cell
    sel: new Set(),            // organizer-selected cells
    repeat: null,              // recurrence label of the sent proposal
    slots: [],                 // sent options: [{s, e}] in UTC ms
    responses: {},
    pending: {},
    history: [],
    confirmed: null,           // {s, e}
    change: null,              // {from:{s,e}}
    acks: {},
    editingConfirmed: false,
    changePick: null,          // option chosen when changing the confirmed time
    error: '',
    log: [],
    avatars: null,             // random avatar per person
    mapTime: null,             // which moment the map shows
    mapPin: null,              // highlighted person on the map
  };
}
let S = freshState();

/* ---------------- Time helpers ---------------- */
const z2 = n => String(n).padStart(2,'0');
const STEP_MS = SLOT_MIN * 60000;
function parts(ms, tz){
  const p = new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(new Date(ms));
  const g = t => +p.find(x => x.type === t).value;
  return { y:g('year'), mo:g('month'), d:g('day'), h:g('hour') % 24, mi:g('minute'), s:g('second') };
}
function offsetMs(ms, tz){ const p = parts(ms, tz); return Date.UTC(p.y,p.mo-1,p.d,p.h,p.mi,p.s) - ms; }
function zonedToUtc(str, tz){
  const [d,t] = str.split('T'); const [y,m,dd] = d.split('-').map(Number); const [h,mi] = t.split(':').map(Number);
  const guess = Date.UTC(y,m-1,dd,h,mi);
  let ms = guess - offsetMs(guess, tz);
  ms = guess - offsetMs(ms, tz);
  return ms;
}
function utcToInput(ms, tz){ const p = parts(ms, tz); return `${p.y}-${z2(p.mo)}-${z2(p.d)}T${z2(p.h)}:${z2(p.mi)}`; }
function fmtDate(ms, tz){ return new Intl.DateTimeFormat('en-US',{timeZone:tz,weekday:'short',month:'short',day:'numeric'}).format(new Date(ms)); }
function fmtTime(ms, tz){ return new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',minute:'2-digit'}).format(new Date(ms)); }
function fmtRange(o, tz){ return `${fmtDate(o.s, tz)} · ${fmtTime(o.s, tz)}–${fmtTime(o.e, tz)}`; }
function localHour(ms, tz){ const p = parts(ms, tz); return p.h + p.mi/60; }
function isDay(ms, tz){ const h = localHour(ms, tz); return h >= DAY_START && h < DAY_END; }
// o = {s, e}; outside if it starts before or ends after the person's preferred hours (local)
function outsidePref(o, p){
  const start = localHour(o.s, p.tz), end = start + (o.e - o.s)/36e5;
  return start < p.pref[0] || end > p.pref[1];
}
function offsetLabel(tz, ms){
  const m = Math.round(offsetMs(ms, tz)/60000), a = Math.abs(m);
  return `UTC${m < 0 ? '−' : '+'}${Math.floor(a/60)}${a % 60 ? ':' + z2(a % 60) : ''}`;
}
function tzName(tz, ms){
  try { return new Intl.DateTimeFormat('en-US',{timeZone:tz,timeZoneName:'long'}).formatToParts(new Date(ms)).find(x => x.type === 'timeZoneName').value; }
  catch(e){ return tz; }
}
const REF_MS = () => (S.slots[0] && S.slots[0].s) || S.cells[0] || zonedToUtc('2026-12-01T12:00', ORGANIZER.tz);
const place = p => `${p.city}, ${p.country}`;
function sunMoon(ms, tz){ return isDay(ms, tz) ? '<span class="icon" title="Daytime">☼</span>' : '<span class="icon" title="Nighttime">☾</span>'; }
function hr(h){ return `${((h + 11) % 12) + 1} ${h < 12 ? 'AM' : 'PM'}`; }
function minLabel(min){ const h = Math.floor(min/60), m = min % 60; return `${((h + 11) % 12) + 1}:${z2(m)} ${h < 12 ? 'AM' : 'PM'}`; }
function flagFor(o, p){
  return outsidePref(o, p) ? `<span class="flag" title="Outside ${p.name}'s preferred hours (${hr(p.pref[0])}–${hr(p.pref[1])})">⚑</span>` : '';
}
// Abbreviation such as PST, EST, AEDT (falls back to a small table where the browser only gives "GMT+11")
const TZ_ABBR = { 'Australia/Melbourne':['AEST','AEDT'], 'Australia/Sydney':['AEST','AEDT'], 'Europe/Berlin':['CET','CEST'],
  'Europe/Paris':['CET','CEST'], 'Europe/London':['GMT','BST'], 'Asia/Tokyo':['JST','JST'], 'Asia/Kolkata':['IST','IST'],
  'Asia/Dubai':['GST','GST'], 'Asia/Yerevan':['AMT','AMT'], 'Africa/Addis_Ababa':['EAT','EAT'] };
function tzAbbr(tz, ms){
  let a = '';
  try { a = new Intl.DateTimeFormat('en-US',{timeZone:tz,timeZoneName:'short'}).formatToParts(new Date(ms)).find(x => x.type === 'timeZoneName').value; } catch(e){}
  if (a && !/^(GMT|UTC)/.test(a)) return a;
  if (TZ_ABBR[tz]){
    const y = new Date(ms).getUTCFullYear(), jan = offsetMs(Date.UTC(y,0,15), tz), jul = offsetMs(Date.UTC(y,6,15), tz);
    return TZ_ABBR[tz][offsetMs(ms, tz) > Math.min(jan, jul) ? 1 : 0];
  }
  return offsetLabel(tz, ms);
}
// People who share a time zone are shown together
function tzGroups(list){
  const m = new Map();
  list.forEach(p => { if (!m.has(p.tz)) m.set(p.tz, []); m.get(p.tz).push(p); });
  return [...m.values()];
}
function groupChip(o, ps, meId){
  const tz = ps[0].tz, outs = ps.filter(p => outsidePref(o, p));
  const cls = ['lt']; if (ps.some(p => p.id === meId)) cls.push('me'); if (outs.length) cls.push('out');
  const places = [...new Set(ps.map(place))].join(' / ');
  const flag = outs.length ? `<span class="flag" title="Outside preferred hours: ${outs.map(p => `${p.name} (${hr(p.pref[0])}–${hr(p.pref[1])})`).join(', ')}">⚑${ps.length > 1 ? ' ' + outs.map(p => p.name).join(', ') : ''}</span>` : '';
  return `<span class="${cls.join(' ')}" title="${tzName(tz, o.s)} (${offsetLabel(tz, o.s)})"><b>${ps.map(p => p.name).join(', ')}</b> · ${places} · ${tzAbbr(tz, o.s)}: ${fmtRange(o, tz)}${sunMoon(o.s, tz)}${flag}</span>`;
}
function chipsFor(o, list, meId){ return tzGroups(list).map(g => groupChip(o, g, meId)).join(''); }
function allChips(o, meId){ return `<div class="times">${chipsFor(o, PEOPLE, meId)}</div>`; }

/* ---------------- Derived ---------------- */
const person = id => PEOPLE.find(p => p.id === id);
const respondedIds = () => PEOPLE.filter(p => S.responses[p.id]).map(p => p.id);
function statusMessage(){
  const n = respondedIds().length, total = PEOPLE.length;
  switch (S.stage){
    case 'setup':      return 'Selecting Dates & Times – Not Sent';
    case 'proposed':   return 'Proposed – Not Final';
    case 'collecting': return `Collecting Responses (${n}/${total}) – Not Final`;
    case 'revised':    return 'Revising Times – Not Final';
    case 'awaiting':   return 'Responses Received – Waiting for Organizer';
    case 'confirmed': {
      if (S.change){
        const ids = Object.keys(S.acks), done = ids.filter(id => S.acks[id]).length;
        if (done < ids.length) return `Confirmed – Time Changed, Waiting for Acknowledgments (${done}/${ids.length})`;
      }
      return 'Confirmed – Final';
    }
  }
}
function log(msg){ S.log.unshift(msg); }

/* ---------------- Calendar (organizer only) ---------------- */
function dateList(){
  const st = S.setup, out = [];
  const toUTC = s => { const [y,m,d] = s.split('-').map(Number); return Date.UTC(y,m-1,d); };
  const fmt = t => { const d = new Date(t); return `${d.getUTCFullYear()}-${z2(d.getUTCMonth()+1)}-${z2(d.getUTCDate())}`; };
  if (!st.start) return out;
  if (!st.recurring){
    if (!st.end) return out;
    for (let t = toUTC(st.start); t <= toUTC(st.end) && out.length < 15; t += 864e5) out.push(fmt(t));
  } else {
    for (let k = 0; k < 7; k++){ const t = toUTC(st.start) + k*864e5; if (st.days.includes(new Date(t).getUTCDay())) out.push(fmt(t)); }
  }
  return out;
}
function setupError(){
  const st = S.setup, toMin = s => { const [h,m] = s.split(':').map(Number); return h*60 + m; };
  if (!st.start) return 'Pick a start date.';
  if (!st.recurring){
    if (!st.end || st.end < st.start) return 'The end date must be on or after the start date.';
    if (dateList().length > 14) return 'Pick a range of 14 days or fewer.';
  } else if (!st.days.length) return 'Pick at least one day of the week.';
  if (toMin(st.to) <= toMin(st.from)) return 'The latest time must be after the earliest time.';
  return '';
}
function refreshCells(){
  const out = [];
  if (!setupError()){
    const [fh,fm] = S.setup.from.split(':').map(Number), [th,tm] = S.setup.to.split(':').map(Number);
    for (const d of dateList())
      for (let m = fh*60 + fm; m < th*60 + tm; m += SLOT_MIN)
        out.push(zonedToUtc(`${d}T${z2(Math.floor(m/60))}:${z2(m % 60)}`, ORGANIZER.tz));
  }
  S.cells = out;
  const valid = new Set(out);
  S.sel = new Set([...S.sel].filter(ms => valid.has(ms)));
}
function repeatLabel(){ return `Repeats ${S.setup.repeat === 'weekly' ? 'weekly' : 'every 2 weeks'}`; }
// Calendar in the organizer's local time: columns = dates (or weekdays when recurring), rows = times.
function buildGrid(){
  const tz = ORGANIZER.tz, cols = new Map(), rows = new Set(), cell = {};
  for (const ms of S.cells){
    const pt = parts(ms, tz), min = pt.h*60 + pt.mi;
    const wd = new Date(Date.UTC(pt.y, pt.mo-1, pt.d)).getUTCDay();
    const key = S.setup.recurring ? 'w' + wd : `${pt.y}-${z2(pt.mo)}-${z2(pt.d)}`;
    if (!cols.has(key)) cols.set(key, { key, first:ms, label: S.setup.recurring ? WD[wd] : fmtDate(ms, tz) });
    rows.add(min); cell[key + '|' + min] = ms;
  }
  return { cols:[...cols.values()].sort((a,b) => a.first - b.first), rows:[...rows].sort((a,b) => a - b), cell };
}
// Continuous selected blocks in each day (raw selection)
function rawBlocks(){
  const g = buildGrid(), out = [];
  for (const c of g.cols){
    let cur = null;
    for (const min of g.rows){
      const ms = g.cell[c.key + '|' + min];
      if (ms !== undefined && S.sel.has(ms)){
        if (cur && cur.e === ms) cur.e = ms + STEP_MS;
        else { cur = { s:ms, e:ms + STEP_MS }; out.push(cur); }
      } else cur = null;
    }
  }
  return out.sort((a,b) => a.s - b.s);
}
const durMs = () => S.setup.dur * 60000;
const durLabel = ms => { const m = ms/60000; return m < 60 ? m + ' min' : (m % 60 ? (m/60) + ' hours' : (m/60) + (m === 60 ? ' hour' : ' hours')); };
// Each block becomes one option that starts where the block starts and lasts the meeting duration
function selectedOptions(){ return rawBlocks().map(b => ({ s:b.s, e:b.s + durMs() })); }
// Snap every block to the meeting duration (used after a click/drag and when the duration changes)
function normalizeSel(){
  const valid = new Set(S.cells), set = new Set();
  rawBlocks().forEach(b => { for (let t = b.s; t < b.s + durMs(); t += STEP_MS) if (valid.has(t)) set.add(t); });
  S.sel = set;
}
function gridHTML(){
  const g = buildGrid(), tz = ORGANIZER.tz;
  if (!g.cols.length) return '<p class="muted small">Choose a valid date and time range to see the calendar.</p>';
  const opts = selectedOptions();
  let h = `<div class="gridwrap"><div class="grid paint" style="grid-template-columns:72px repeat(${g.cols.length}, minmax(64px,1fr))">`;
  h += `<div></div>` + g.cols.map(c => `<div class="gh">${c.label}</div>`).join('');
  g.rows.forEach((min, ri) => {
    const anyMs = g.cols.map(c => g.cell[c.key + '|' + min]).find(v => v !== undefined);
    h += `<div class="rl">${min % 60 === 0 ? minLabel(min) + sunMoon(anyMs, tz) : ''}</div>`;
    g.cols.forEach((c, ci) => {
      const ms = g.cell[c.key + '|' + min], hour = min % 60 === 0 ? ' hour' : '';
      if (ms === undefined){ h += `<div class="cell none${hour}"></div>`; return; }
      const o = { s:ms, e:ms + STEP_MS };
      const outFor = PEOPLE.filter(p => outsidePref(o, p));
      const title = tzGroups(PEOPLE).map(g => `${g.map(p => p.name).join(', ')} (${tzAbbr(g[0].tz, ms)}): ${fmtDate(ms, g[0].tz)} ${fmtTime(ms, g[0].tz)}${g.some(p => outsidePref(o, p)) ? ' ⚑ outside preferred hours: ' + g.filter(p => outsidePref(o, p)).map(p => p.name).join(', ') : ''}`).join('\n');
      const idx = opts.findIndex(x => ms >= x.s && ms < x.e);
      const label = idx >= 0 && opts[idx].s === ms ? `<span class="pl">${LETTERS[idx] || '!'}</span>` : '';
      h += `<div class="cell${hour}${outFor.length ? ' out' : ''}${S.sel.has(ms) ? ' on' : ''}" data-ms="${ms}" data-c="${ci}" data-r="${ri}" title="${title}" style="position:relative">${label}</div>`;
    });
  });
  return h + `</div></div>`;
}

/* ---------------- Rendering ---------------- */
function render(){
  document.getElementById('viewas').innerHTML =
    `<span>View as:</span>` + PEOPLE.map(p =>
      `<button class="chipbtn ${S.view===p.id?'on':''}" data-act="view" data-id="${p.id}">${p.name}${p.organizer?' (Organizer)':''}</button>`).join('');
  const me = person(S.view);
  let html = renderStatus();
  html += me.organizer ? renderOrganizer(me) : renderParticipant(me);
  if (me.organizer) html += `<div class="card"><h2>Activity</h2>${S.log.length ? `<ul class="log">${S.log.map(l => `<li>${l}</li>`).join('')}</ul>` : '<span class="muted small">No activity yet.</span>'}</div>`;
  if (!S.avatars) S.avatars = newAvatars();
  html += renderMap(me);
  html += renderDemo();
  document.getElementById('app').innerHTML = html;
}

function renderStatus(){
  const cur = STEPS.findIndex(s => s.key === S.stage);
  const n = respondedIds().length;
  const steps = STEPS.map((s, i) => {
    let cls = 'step', dot = i + 1;
    const done = s.key === 'revised' ? (S.round > 1 && S.stage !== 'revised') : i < cur;
    if (i === cur) cls += ' current';
    else if (done) { cls += ' done'; dot = '✓'; }
    let label = s.label;
    if (s.key === 'collecting' && S.slots.length && !['setup','revised'].includes(S.stage)) label += ` (${n}/${PEOPLE.length})`;
    return `<span class="${cls}"><span class="dot">${dot}</span>${label}</span>`;
  }).join('<span class="arrow">→</span>');
  const final = S.stage === 'confirmed' && !statusMessage().includes('Waiting');
  const ref = REF_MS();
  const team = tzGroups(PEOPLE).map(g => `<span class="member" title="${tzName(g[0].tz, ref)}"><b>${tzAbbr(g[0].tz, ref)}</b> <span class="muted">(${offsetLabel(g[0].tz, ref)})</span><br>
    ${g.map(p => `${p.name}${p.organizer ? ' (organizer)' : ''} · ${place(p)} · <span class="muted">prefers ${hr(p.pref[0])}–${hr(p.pref[1])}</span>`).join('<br>')}</span>`).join('');
  return `<div class="card">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">${MEETING.title}${S.slots.length ? ` · ${durLabel(S.slots[0].e - S.slots[0].s)}` : ''}${S.repeat ? ` · <span class="muted">${S.repeat}</span>` : ''}</h2>
      <span class="muted small">Organizer: ${ORGANIZER.name} (${place(ORGANIZER)})</span>
    </div>
    <div class="status">${steps}</div>
    <span class="statusmsg ${final?'final':''}">${statusMessage()}</span>
    ${S.round > 1 ? `<span class="round">Round ${S.round}</span>` : ''}
    <div class="team">${team}</div>
  </div>`;
}

/* ----- Organizer ----- */
function renderOrganizer(me){
  if (S.stage === 'setup' || S.stage === 'revised') return renderSelectPage(me);
  let h = S.stage === 'confirmed' ? renderConfirmedOrganizer(me) : renderSummary(me);
  if (['proposed','collecting','awaiting'].includes(S.stage)){
    h += `<div class="card"><h2>Your own response</h2>
      <p class="muted small" style="margin-top:-4px">As a member of the team, you also answer each proposed time.</p>
      ${renderResponseForm(me)}</div>`;
  }
  return h;
}

// Select Dates & Times page: range/recurrence on top, calendar to click/drag times, options preview below
function renderSelectPage(me){
  const st = S.setup, err = setupError(), isRevision = S.stage === 'revised';
  const timeOpts = sel => { let o = ''; for (let m = 0; m < 24*60; m += SLOT_MIN){ const v = `${z2(Math.floor(m/60))}:${z2(m%60)}`; o += `<option value="${v}" ${v===sel?'selected':''}>${minLabel(m)}</option>`; } return o; };
  const dates = st.recurring
    ? `<div class="field"><label>Days of the week</label><div class="daychips">${WEEK_ORDER.map(d => `<button class="daychip ${st.days.includes(d)?'on':''}" data-act="day" data-d="${d}">${WD[d]}</button>`).join('')}</div></div>
       <div class="field"><label>Repeats</label><select data-act="setup" data-k="repeat"><option value="weekly" ${st.repeat==='weekly'?'selected':''}>Every week</option><option value="biweekly" ${st.repeat==='biweekly'?'selected':''}>Every 2 weeks</option></select></div>
       <div class="field"><label>Starting from</label><input type="date" data-act="setup" data-k="start" value="${st.start}"></div>`
    : `<div class="field"><label>From date</label><input type="date" data-act="setup" data-k="start" value="${st.start}"></div>
       <div class="field"><label>To date</label><input type="date" data-act="setup" data-k="end" value="${st.end}"></div>`;

  const opts = selectedOptions();
  let optErr = '';
  if (opts.length > 3) optErr = `You selected ${opts.length} time blocks. Propose at most 3.`;
  const canSend = !err && opts.length >= 2 && opts.length <= 3;
  const optList = opts.length ? opts.map((o, i) => `<div class="slot opt-card">
      <div class="slot-head"><span><span class="slot-title">Option ${LETTERS[i] || '–'}</span> · <span class="big">${fmtRange(o, me.tz)}</span>${sunMoon(o.s, me.tz)}</span>
      <span class="small muted">${durLabel(o.e - o.s)}</span></div>
      ${allChips(o, me.id)}
    </div>`).join('') : '<p class="muted small">No times selected yet. Select 2 or 3 time blocks on the calendar.</p>';

  return `${isRevision ? renderPrevRound() : ''}
  <div class="card">
    <h2>${isRevision ? `Select new dates &amp; times – Round ${S.round}` : 'Select dates &amp; times'}</h2>
    <div class="seg"><button class="${!st.recurring?'on':''}" data-act="recurring" data-v="0">One-time meeting</button><button class="${st.recurring?'on':''}" data-act="recurring" data-v="1">Recurring meeting</button></div>
    <div class="setup-grid">
      ${dates}
      <div class="field"><label>Earliest time</label><select data-act="setup" data-k="from">${timeOpts(st.from)}</select></div>
      <div class="field"><label>Latest time</label><select data-act="setup" data-k="to">${timeOpts(st.to)}</select></div>
      <div class="field"><label>Meeting duration</label><select data-act="dur">${[30,60,90,120].map(d => `<option value="${d}" ${st.dur===d?'selected':''}>${d < 60 ? d + ' min' : (d/60) + (d === 60 ? ' hour' : ' hours')}</option>`).join('')}</select></div>
    </div>
    <p class="muted small">Times are in your time zone: ${place(me)} · ${tzAbbr(me.tz, REF_MS())} (${offsetLabel(me.tz, REF_MS())}).</p>
    ${err ? `<div class="error">${err}</div>` : ''}
  </div>
  <div class="card">
    <h2>Calendar${st.recurring ? ' – days of the week' : ''}</h2>
    <p class="small muted" style="margin-top:-4px">Click a start time to place a ${durLabel(durMs())} meeting there, or hold the mouse button and drag to mark a period – each block starts the meeting at its first time and is fitted to the meeting duration. Each block is one proposed option. Click a selected block to remove it. Hover a cell to see everyone's local time.</p>
    <div class="legend" style="margin-bottom:4px"><span><span class="sw" style="background:#58b37f"></span>selected</span><span><span class="sw cell out" style="height:10px"></span>outside someone's preferred hours</span><span>☼ / ☾ day / night for you</span></div>
    ${gridHTML()}
  </div>
  <div class="card">
    <h2>Proposed options (${opts.length})</h2>
    <div class="legend" style="margin-bottom:10px"><span>☼ daytime</span><span>☾ nighttime</span><span><span class="flag">⚑</span> outside that person's preferred hours</span></div>
    ${optList}
    ${optErr ? `<div class="error">${optErr}</div>` : ''}
    ${S.error ? `<div class="error">${S.error}</div>` : ''}
    <div class="actions">
      <button class="btn primary" data-act="send" ${canSend?'':'disabled'}>${isRevision ? 'Send revised proposal (starts new response round)' : 'Send proposal'}</button>
      ${opts.length ? `<button class="btn" data-act="clearSel">Clear selection</button>` : ''}
      ${isRevision ? `<button class="btn" data-act="cancelRevise">Cancel</button>` : ''}
    </div>
    ${isRevision ? `<p class="muted small">Sending clears the previous responses. All participants are notified and must respond again.</p>` : ''}
  </div>`;
}

function renderPrevRound(){
  const last = S.history[S.history.length - 1];
  if (!last) return '';
  const rows = last.slots.map((o, i) => {
    const c = { prefer:0, inconvenient:0, cannot:0 };
    Object.values(last.responses).forEach(r => { if (r.noneWork) c.cannot++; else if (r.answers[i]) c[r.answers[i]]++; });
    return `<li>Option ${LETTERS[i]} (${fmtRange(o, ORGANIZER.tz)}): ${c.prefer} prefer · ${c.inconvenient} inconvenient · ${c.cannot} cannot</li>`;
  }).join('');
  const none = Object.entries(last.responses).filter(([,r]) => r.noneWork).map(([id]) => person(id).name);
  return `<div class="card"><h3>Round ${last.round} results</h3><ul class="log">${rows}
    <li>None of these work: ${none.length ? none.join(', ') : '—'}</li></ul></div>`;
}

function renderSummary(me){
  const waiting = PEOPLE.filter(p => !S.responses[p.id]).map(p => p.name);
  const none = PEOPLE.filter(p => S.responses[p.id]?.noneWork).map(p => p.name);
  const slots = S.slots.map((o, i) => {
    // "None of These Work" counts as Cannot Attend for every option
    const group = k => PEOPLE.filter(p => { const r = S.responses[p.id]; return r && (r.noneWork ? k === 'cannot' : r.answers[i] === k); })
                             .map(p => `<span class="name">${p.name}${S.responses[p.id].noneWork ? ' <span class="muted small">(none work)</span>' : ''}</span>`).join('') || '<span class="muted small">—</span>';
    return `<div class="slot">
      <div class="slot-head">
        <span><span class="slot-title">Option ${LETTERS[i]}</span> · <span class="big">${fmtRange(o, me.tz)}</span>${sunMoon(o.s, me.tz)}</span>
        <button class="btn ok" data-act="confirm" data-i="${i}">Confirm this time</button>
      </div>
      ${allChips(o, me.id)}
      <div class="cols">
        <div class="col p"><h4>Prefer</h4>${group('prefer')}</div>
        <div class="col i"><h4>Can attend – inconvenient</h4>${group('inconvenient')}</div>
        <div class="col c"><h4>Cannot attend</h4>${group('cannot')}</div>
      </div>
    </div>`;
  }).join('');
  return `<div class="card">
    <h2>Response summary</h2>
    <div class="row small" style="margin-bottom:10px">
      <span><b>Waiting on:</b> ${waiting.length ? waiting.join(', ') : 'nobody'}</span>
      <span><b>None of these work:</b> ${none.length ? none.join(', ') : '—'}</span>
    </div>
    ${slots}
    <div class="actions">
      <button class="btn" data-act="revise">Change times &amp; start a new round</button>
    </div>
  </div>`;
}

function renderConfirmedOrganizer(me){
  const o = S.confirmed;
  let ackInfo = '';
  if (S.change){
    ackInfo = `<div style="margin-top:10px" class="small"><b>Acknowledgments:</b> ` +
      Object.keys(S.acks).map(id => `<span class="name">${person(id).name} ${S.acks[id] ? '✓' : '… pending'}</span>`).join('') + `</div>`;
  }
  // Changing the confirmed time: choose one of the times already proposed in this round
  const counts = i => {
    const c = { prefer:0, inconvenient:0, cannot:0 };
    Object.values(S.responses).forEach(r => { if (r.noneWork) c.cannot++; else if (r.answers[i]) c[r.answers[i]]++; });
    return `${c.prefer} prefer · ${c.inconvenient} inconvenient · ${c.cannot} cannot`;
  };
  const choices = S.slots.map((opt, i) => {
    const current = opt.s === o.s;
    return `<label class="slot" style="display:block;cursor:${current ? 'default' : 'pointer'};${S.changePick === i ? 'border-color:var(--accent);background:var(--accent-soft)' : ''}${current ? ';opacity:.6' : ''}">
      <div class="slot-head"><span><input type="radio" name="changePick" data-act="changePick" data-i="${i}" ${S.changePick === i ? 'checked' : ''} ${current ? 'disabled' : ''}>
        <span class="slot-title">Option ${LETTERS[i]}</span> · <span class="big">${fmtRange(opt, me.tz)}</span>${sunMoon(opt.s, me.tz)}${current ? ' <span class="small muted">(currently confirmed)</span>' : ''}</span>
        <span class="small muted">${counts(i)}</span></div>
      ${allChips(opt, me.id)}
    </label>`;
  }).join('');
  const editor = S.editingConfirmed ? `
    <div style="margin-top:12px">
      <h3>Choose another proposed time</h3>
      ${choices}
      ${S.error ? `<div class="error">${S.error}</div>` : ''}
      <div class="actions">
        <button class="btn primary" data-act="applyChange" ${S.changePick === null ? 'disabled' : ''}>Send updated confirmation</button>
        <button class="btn" data-act="cancelChange">Cancel</button>
        <span class="small muted">Participants are notified and must acknowledge the change.</span>
      </div>
    </div>` : `<div class="actions"><button class="btn" data-act="editConfirmed">Change confirmed time</button></div>`;
  return `<div class="card">
    <h2>Confirmed meeting</h2>
    <div class="confirmed-box">
      <div class="big">${fmtRange(o, me.tz)}${sunMoon(o.s, me.tz)}</div>
      ${S.repeat ? `<div class="small">${S.repeat} from this date</div>` : ''}
      ${S.change ? `<div class="small">Changed from <span class="strike">${fmtRange(S.change.from, me.tz)}</span></div>` : ''}
      ${allChips(o, me.id)}
    </div>
    ${ackInfo}
    ${editor}
  </div>`;
}

/* ----- Participant ----- */
function renderParticipant(me){
  if (S.stage === 'setup'){
    return `<div class="card"><h2>Hi ${me.name}</h2><p class="muted">No meeting times have been proposed yet. You'll be notified when ${ORGANIZER.name} sends a proposal.</p></div>`;
  }
  if (S.stage === 'revised'){
    return `<div class="banner info"><span><b>${ORGANIZER.name} is selecting new times.</b> Your previous answers will be cleared and you'll be asked to respond again.</span></div>`;
  }
  if (S.stage === 'confirmed') return renderConfirmedParticipant(me);
  let h = '';
  if (S.round > 1 && !S.responses[me.id]){
    h += `<div class="banner alert"><span><b>New times proposed (Round ${S.round}).</b> None of the earlier times worked, so please review and respond again.</span></div>`;
  }
  h += `<div class="card"><h2>Respond to proposed times</h2>
    <p class="muted small" style="margin-top:-4px">Times are shown in your local time (${place(me)}) first${S.repeat ? ` · ${S.repeat}` : ''}. Pick one answer for each time.</p>
    ${renderResponseForm(me)}</div>`;
  return h;
}

function renderResponseForm(me){
  if (!S.pending[me.id]) {
    const r = S.responses[me.id];
    S.pending[me.id] = r ? JSON.parse(JSON.stringify(r)) : { answers:{}, noneWork:false };
  }
  const pend = S.pending[me.id];
  const submitted = !!S.responses[me.id];
  const slots = S.slots.map((o, i) => {
    const opts = Object.entries(ANSWERS).map(([k, a]) => {
      const sel = pend.answers[i] === k && !pend.noneWork;
      return `<label class="opt ${sel ? 'sel-'+k : ''} ${pend.noneWork ? 'disabled' : ''}">
        <input type="radio" name="r-${me.id}-${i}" data-act="answer" data-i="${i}" data-v="${k}" ${sel?'checked':''} ${pend.noneWork?'disabled':''}>${a.label}</label>`;
    }).join('');
    const others = chipsFor(o, PEOPLE.filter(p => p.id !== me.id), me.id);
    return `<div class="slot">
      <div class="slot-head"><span><span class="slot-title">Option ${LETTERS[i]}</span> · <span class="big">${fmtRange(o, me.tz)}</span>${sunMoon(o.s, me.tz)}${flagFor(o, me)}</span></div>
      ${outsidePref(o, me) ? `<div class="small" style="color:var(--warn)">⚑ Outside your preferred hours (${hr(me.pref[0])}–${hr(me.pref[1])})</div>` : ''}
      <div class="times">${others}</div>
      <div class="opts">${opts}</div>
    </div>`;
  }).join('');
  const complete = pend.noneWork || S.slots.every((_, i) => pend.answers[i]);
  return `${slots}
    <label class="nonework"><input type="checkbox" data-act="noneWork" ${pend.noneWork?'checked':''}>
      <span><b>None of These Work</b> <span class="muted small">– tell the organizer none of the proposed times is suitable</span></span></label>
    <div class="actions">
      <button class="btn primary" data-act="submit" data-id="${me.id}" ${complete?'':'disabled'}>${submitted ? 'Update response' : 'Submit response'}</button>
      ${submitted ? `<span class="small" style="color:var(--ok)">✓ Response submitted – you can change it until the meeting is confirmed.</span>` : ''}
    </div>`;
}

function renderConfirmedParticipant(me){
  const o = S.confirmed;
  let banner = '';
  if (S.change && me.id in S.acks){
    banner = S.acks[me.id]
      ? `<div class="banner okb"><span>✓ You acknowledged the updated meeting time.</span></div>`
      : `<div class="banner alert"><span><b>Meeting time changed.</b>
          <span class="strike">${fmtRange(S.change.from, me.tz)}</span> → <b>${fmtRange(o, me.tz)}</b> (your time)</span>
          <button class="btn primary" data-act="ack" data-id="${me.id}">Acknowledge change</button></div>`;
  }
  return `${banner}<div class="card"><h2>Meeting confirmed</h2>
    <div class="confirmed-box">
      <div class="big">${fmtRange(o, me.tz)}${sunMoon(o.s, me.tz)}${flagFor(o, me)}</div>
      <div class="small muted">Your local time (${place(me)} · ${tzAbbr(me.tz, o.s)})${S.repeat ? ` · ${S.repeat}` : ''}</div>
      ${allChips(o, me.id)}
    </div></div>`;
}

/* ----- Prototype controls (for evaluation sessions) ----- */
function renderDemo(){
  const propOpen = ['proposed','collecting','awaiting'].includes(S.stage);
  return `<div class="card demo"><h3>Prototype controls</h3>
    <p class="muted small" style="margin-top:0">Not part of the design – used to move through the flow during evaluation.</p>
    <div class="actions" style="margin-top:4px">
      <button class="btn" data-act="autofill" ${propOpen?'':'disabled'}>Fill sample responses for others</button>
      <button class="btn" data-act="reset">Reset prototype</button>
    </div></div>`;
}
function sampleResponse(p){
  const answers = {};
  S.slots.forEach((o, i) => {
    const h = localHour(o.s, p.tz);
    answers[i] = !outsidePref(o, p) ? 'prefer' : (h >= 6 && h <= 22 ? 'inconvenient' : 'cannot');
  });
  const noneWork = Object.values(answers).every(v => v === 'cannot');
  return { answers: noneWork ? {} : answers, noneWork };
}

/* ---------------- Actions ---------------- */
function updateStageAfterResponse(){
  if (!['proposed','collecting','awaiting'].includes(S.stage)) return;
  const n = respondedIds().length;
  S.stage = n === 0 ? 'proposed' : (n < PEOPLE.length ? 'collecting' : 'awaiting');
}

function handle(act, el){
  const i = el.dataset.i !== undefined ? +el.dataset.i : null;
  S.error = '';
  switch (act){
    case 'view': S.view = el.dataset.id; break;
    case 'recurring': S.setup.recurring = el.dataset.v === '1'; S.sel = new Set(); refreshCells(); break;
    case 'day': { const d = +el.dataset.d, ds = S.setup.days; ds.includes(d) ? ds.splice(ds.indexOf(d),1) : ds.push(d); refreshCells(); break; }
    case 'setup': S.setup[el.dataset.k] = el.value; refreshCells(); break;
    case 'dur': S.setup.dur = +el.value; normalizeSel(); break;
    case 'clearSel': S.sel = new Set(); break;
    case 'send': {
      const opts = selectedOptions();
      if (opts.length < 2 || opts.length > 3) { S.error = 'Select 2 or 3 time blocks.'; break; }
      S.slots = opts; S.responses = {}; S.pending = {};
      S.repeat = S.setup.recurring ? repeatLabel() : null;
      S.stage = 'proposed';
      log(S.round > 1 ? `Round ${S.round}: revised proposal sent – all participants notified to respond again.` : `Proposal sent with ${opts.length} times.`);
      break;
    }
    case 'revise':
      S.history.push({ round:S.round, slots:S.slots.map(o => ({...o})), responses:JSON.parse(JSON.stringify(S.responses)) });
      S.round++; S.stage = 'revised';
      // start from the previous options so the organizer can adjust them
      S.sel = new Set(); S.slots.forEach(o => { for (let t = o.s; t < o.e; t += STEP_MS) S.sel.add(t); });
      refreshCells();
      log(`Organizer started selecting new times (Round ${S.round}).`);
      break;
    case 'cancelRevise': {
      const last = S.history.pop();
      S.round = last.round; S.slots = last.slots; S.responses = last.responses; S.pending = {};
      S.stage = 'proposed'; updateStageAfterResponse();
      log('Organizer cancelled the revision.');
      break;
    }
    case 'answer': S.pending[S.view].answers[i] = el.dataset.v; break;
    case 'noneWork': S.pending[S.view].noneWork = el.checked; break;
    case 'submit': {
      const p = S.pending[el.dataset.id];
      S.responses[el.dataset.id] = JSON.parse(JSON.stringify(p));
      log(`${person(el.dataset.id).name} ${p.noneWork ? 'selected “None of These Work”' : 'submitted a response'}.`);
      updateStageAfterResponse();
      break;
    }
    case 'confirm':
      S.confirmed = { ...S.slots[i] }; S.stage = 'confirmed'; S.change = null; S.acks = {};
      log(`Organizer confirmed Option ${LETTERS[i]}.`);
      break;
    case 'editConfirmed': S.editingConfirmed = true; S.changePick = null; break;
    case 'cancelChange': S.editingConfirmed = false; break;
    case 'changePick': S.changePick = i; break;
    case 'applyChange': {
      if (S.changePick === null) { S.error = 'Choose one of the proposed times.'; break; }
      const next = S.slots[S.changePick];
      S.change = { from: { ...S.confirmed } };
      S.confirmed = { ...next };
      S.acks = {}; PEOPLE.filter(p => !p.organizer).forEach(p => S.acks[p.id] = false);
      S.editingConfirmed = false;
      log(`Organizer changed the confirmed time to Option ${LETTERS[S.changePick]} – participants notified and asked to acknowledge.`);
      S.changePick = null;
      break;
    }
    case 'ack': S.acks[el.dataset.id] = true; log(`${person(el.dataset.id).name} acknowledged the change.`); break;
    case 'autofill':
      PEOPLE.filter(p => p.id !== S.view && !S.responses[p.id]).forEach(p => {
        S.responses[p.id] = sampleResponse(p); delete S.pending[p.id];
        log(`${p.name} ${S.responses[p.id].noneWork ? 'selected “None of These Work”' : 'submitted a response'} (sample).`);
      });
      updateStageAfterResponse();
      break;
    case 'reset': S = freshState(); refreshCells(); break;
    case 'mapTime': S.mapTime = el.dataset.k; break;
    case 'shuffle': S.avatars = newAvatars(); break;
  }
  render();
}

/* ---------------- Events ---------------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'INPUT' || el.tagName === 'SELECT') return;
  if (el.disabled) return;
  handle(el.dataset.act, el);
});
document.addEventListener('change', e => {
  const el = e.target; const act = el.dataset.act;
  if (!act) return;
  handle(act, el);
});

// Organizer calendar: click to toggle a time, hold and drag to select a period (rectangle across days)
let drag = null;
function paintRect(c, r){
  const set = new Set(drag.base);
  drag.grid.querySelectorAll('.cell[data-ms]').forEach(cell => {
    const cc = +cell.dataset.c, rr = +cell.dataset.r;
    if (cc >= Math.min(drag.c, c) && cc <= Math.max(drag.c, c) && rr >= Math.min(drag.r, r) && rr <= Math.max(drag.r, r))
      drag.mode === 'add' ? set.add(+cell.dataset.ms) : set.delete(+cell.dataset.ms);
  });
  S.sel = set;
  drag.grid.querySelectorAll('.cell[data-ms]').forEach(cell => cell.classList.toggle('on', set.has(+cell.dataset.ms)));
}
document.addEventListener('pointerdown', e => {
  const cell = e.target.closest('.paint .cell[data-ms]');
  if (!cell) return;
  e.preventDefault();
  const ms = +cell.dataset.ms;
  if (S.sel.has(ms)){ // remove the whole block this time belongs to
    const b = rawBlocks().find(x => ms >= x.s && ms < x.e);
    for (let t = b.s; t < b.e; t += STEP_MS) S.sel.delete(t);
    render(); return;
  }
  drag = { grid: cell.closest('.paint'), c:+cell.dataset.c, r:+cell.dataset.r, mode:'add', base:new Set(S.sel) };
  paintRect(drag.c, drag.r);
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const cell = el && el.closest('.cell[data-ms]');
  if (cell && cell.closest('.paint') === drag.grid) paintRect(+cell.dataset.c, +cell.dataset.r);
});
document.addEventListener('pointerup', () => { if (drag){ drag = null; normalizeSel(); render(); } });

/* ---------------- 2D world map with time zones and avatars ---------------- */
const MAP_W = 960, MAP_H = 400, LAT_TOP = 84, LAT_BOT = -60;
const mx = lon => (lon + 180) / 360 * MAP_W;
const my = lat => (LAT_TOP - lat) / (LAT_TOP - LAT_BOT) * MAP_H;
// Simplified continent outlines [lon, lat] – medium fidelity, not to scale

  [[-10,36],[-9,43],[-1,44],[-5,48],[2,51],[8,54],[8,57],[5,61],[12,66],[18,70],[28,71],[40,68],[55,70],[68,73],[80,73],[100,77],[112,74],[130,72],[150,71],[170,70],[180,68],[180,65],[170,60],[160,55],[156,51],[142,53],[140,47],[133,43],[129,35],[126,37],[122,40],[121,31],[117,24],[110,20],[106,17],[109,12],[104,9],[103,1],[100,6],[98,16],[94,17],[92,22],[88,22],[80,15],[78,8],[73,17],[72,21],[67,25],[58,25],[56,27],[50,30],[48,29],[51,25],[56,24],[59,22],[55,17],[44,12],[43,15],[39,21],[35,28],[34,31],[36,36],[30,36],[27,37],[26,40],[23,40],[24,37],[21,38],[19,42],[13,45],[16,41],[18,40],[16,38],[12,42],[8,44],[3,43],[-1,37],[-6,36]],

  [[114,-22],[113,-26],[115,-34],[118,-35],[124,-33],[131,-31],[135,-35],[138,-35],[140,-38],[146,-39],[150,-37],[153,-28],[153,-25],[146,-19],[142,-11],[141,-17],[136,-12],[132,-11],[129,-15],[125,-14],[122,-18]],
  [[-5,50],[1,51],[2,53],[-1,55],[-2,58],[-5,58],[-6,56],[-3,54],[-5,52]],
  [[130,31],[132,34],[135,34],[140,35],[141,39],[142,43],[145,44],[141,45],[140,41],[138,37],[133,35]],
  [[95,5],[98,4],[106,-6],[101,-3]], [[109,1],[117,7],[119,0],[116,-4],[110,-3]], [[131,-1],[141,-3],[150,-10],[141,-9]],
  [[172,-34],[178,-38],[175,-41],[171,-44],[167,-46],[170,-42],[174,-38]],
  [[44,-25],[47,-25],[50,-15],[49,-12],[44,-17]],
];
const COORDS = { seyed:[-122.3,47.6], ahmed:[145.0,-37.8], luel:[-77.0,38.9] };

// Random cartoon avatars (regenerated with "Shuffle avatars")
const SKIN = ['#f5d0b5','#e8b48f','#c98e66','#a26a45','#7a4a2c','#f1c7a0'];
const HAIR = ['#2b1d14','#5a3a22','#8c5a2b','#d4a24c','#1c1c1c','#9b9b9b','#b5462f'];
const BG = ['#cfe0fb','#d7f0e1','#fde6c8','#f6d3e3','#e2dcf7','#d3eef2'];
const pickR = a => a[Math.floor(Math.random() * a.length)];
function newAvatars(){ const a = {}; PEOPLE.forEach(p => a[p.id] = { skin:pickR(SKIN), hair:pickR(HAIR), bg:pickR(BG), style:Math.floor(Math.random()*4), glasses:Math.random() < .35 }); return a; }
function avatarSVG(a, r){
  const hair = [
    `<path d="M${-r*.62},${-r*.05} Q${-r*.6},${-r*.78} 0,${-r*.78} Q${r*.6},${-r*.78} ${r*.62},${-r*.05} Q${r*.35},${-r*.5} 0,${-r*.5} Q${-r*.35},${-r*.5} ${-r*.62},${-r*.05}Z" fill="${a.hair}"/>`,
    `<path d="M${-r*.66},${r*.45} L${-r*.66},${-r*.2} Q${-r*.6},${-r*.8} 0,${-r*.8} Q${r*.6},${-r*.8} ${r*.66},${-r*.2} L${r*.66},${r*.45} L${r*.5},${r*.45} L${r*.5},${-r*.25} Q0,${-r*.55} ${-r*.5},${-r*.25} L${-r*.5},${r*.45}Z" fill="${a.hair}"/>`,
    `<path d="M${-r*.58},${-r*.25} Q0,${-r*1.0} ${r*.58},${-r*.25} Q0,${-r*.6} ${-r*.58},${-r*.25}Z" fill="${a.hair}"/><circle cx="0" cy="${-r*.82}" r="${r*.2}" fill="${a.hair}"/>`,
    `<path d="M${-r*.6},${-r*.2} Q0,${-r*.95} ${r*.6},${-r*.2} Q0,${-r*.42} ${-r*.6},${-r*.2}Z" fill="${a.hair}"/>`,
  ][a.style];
  const glasses = a.glasses ? `<g fill="none" stroke="#333" stroke-width="${r*.06}"><circle cx="${-r*.2}" cy="${-r*.05}" r="${r*.15}"/><circle cx="${r*.2}" cy="${-r*.05}" r="${r*.15}"/><line x1="${-r*.05}" y1="${-r*.05}" x2="${r*.05}" y2="${-r*.05}"/></g>` : '';
  return `<circle r="${r}" fill="${a.bg}" stroke="#fff" stroke-width="${r*.12}"/>
    <circle cy="${r*.05}" r="${r*.55}" fill="${a.skin}"/>${hair}
    <circle cx="${-r*.2}" cy="${-r*.05}" r="${r*.06}" fill="#222"/><circle cx="${r*.2}" cy="${-r*.05}" r="${r*.06}" fill="#222"/>${glasses}
    <path d="M${-r*.18},${r*.22} Q0,${r*.36} ${r*.18},${r*.22}" fill="none" stroke="#7a3b2e" stroke-width="${r*.07}" stroke-linecap="round"/>`;
}

// Moments the map can show
function mapMoments(){
  const list = [{ key:'now', label:'Now', ms:Date.now() }];
  S.slots.forEach((o, i) => list.push({ key:'opt' + i, label:`Option ${LETTERS[i]}`, ms:o.s }));
  if (S.confirmed) list.push({ key:'confirmed', label:'Confirmed', ms:S.confirmed.s });
  return list;
}
function currentMoment(){
  const list = mapMoments(), by = k => list.find(m => m.key === k);
  return by(S.mapTime) || by('confirmed') || by('opt0') || by('now');
}
// Night side of the earth (day/night terminator) for a UTC moment
function nightPath(ms){
  const d = new Date(ms), rad = Math.PI / 180;
  const doy = (Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - Date.UTC(d.getUTCFullYear(), 0, 0)) / 864e5;
  const decl = -23.44 * Math.cos(2 * Math.PI / 365 * (doy + 10));
  const lonS = -((d.getUTCHours() + d.getUTCMinutes() / 60) - 12) * 15;
  const pts = [];
  for (let lon = -180; lon <= 180; lon += 3){
    const lat = Math.atan(-Math.cos((lon - lonS) * rad) / Math.tan(decl * rad)) / rad;
    pts.push(`${mx(lon).toFixed(1)},${my(Math.max(LAT_BOT, Math.min(LAT_TOP, lat))).toFixed(1)}`);
  }
  const edge = decl < 0 ? 0 : MAP_H; // night covers the pole that is tilted away from the sun
  return `M0,${edge} L${pts.join(' L')} L${MAP_W},${edge}Z`;
}

function renderMap(me){
  const m = currentMoment(), ms = m.ms;
  // nominal 15° time-zone bands
  let bands = '';
  for (let off = -12; off <= 12; off++){
    const x1 = mx(Math.max(-180, off * 15 - 7.5)), x2 = mx(Math.min(180, off * 15 + 7.5));
    const pinned = S.mapPin && Math.round(COORDS[S.mapPin][0] / 15) === off;
    bands += `<rect x="${x1}" y="0" width="${x2 - x1}" height="${MAP_H}" fill="${pinned ? 'rgba(47,111,222,.16)' : off % 2 ? 'rgba(0,0,0,.025)' : 'rgba(0,0,0,0)'}"/>
      <text x="${(x1 + x2) / 2}" y="${MAP_H - 6}" text-anchor="middle" font-size="9.5" fill="#8a93a3">${off === 0 ? 'UTC' : (off > 0 ? '+' : '−') + Math.abs(off)}</text>`;
  }
  const land = LAND.map(poly => `<path d="M${poly.map(([lo, la]) => `${mx(lo).toFixed(1)},${my(la).toFixed(1)}`).join(' L')}Z" fill="#d9dee6" stroke="#c3cad6" stroke-width=".8"/>`).join('');
  // avatars, grouped by time zone (nudged apart if close)
  const placed = [];
  const avatars = PEOPLE.map(p => {
    let [lo, la] = COORDS[p.id] || [0, 0], x = mx(lo), y = my(la);
    while (placed.some(q => Math.hypot(q[0] - x, q[1] - y) < 34)) x += 34;
    placed.push([x, y]);
    const a = S.avatars[p.id], night = !isDay(ms, p.tz);
    const label = `${p.name} · ${fmtTime(ms, p.tz)} ${tzAbbr(p.tz, ms)}`;
    const w = label.length * 6.1 + 14;
    return `<g class="mav" data-avatar="${p.id}" transform="translate(${x},${y})" style="cursor:pointer">
      <circle r="3" fill="var(--accent)"/>
      <g transform="translate(0,-26)">${avatarSVG(a, 17)}</g>
      <rect x="${-w / 2}" y="6" width="${w}" height="17" rx="8.5" fill="${S.mapPin === p.id ? 'var(--accent)' : '#fff'}" stroke="#c3cad6"/>
      <text y="18.5" text-anchor="middle" font-size="11" fill="${S.mapPin === p.id ? '#fff' : '#1f2430'}">${label}${night ? ' ☾' : ' ☼'}</text>
    </g>`;
  }).join('');
  const groups = tzGroups(PEOPLE).map(g => `<span class="member"><b>${tzAbbr(g[0].tz, ms)}</b> <span class="muted">(${offsetLabel(g[0].tz, ms)})</span> · ${g.map(p => p.name).join(', ')} · ${fmtDate(ms, g[0].tz)} ${fmtTime(ms, g[0].tz)}</span>`).join('');
  return `<div class="card">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">Team map &amp; time zones</h2>
      <div class="row">
        <div class="seg">${mapMoments().map(x => `<button class="${x.key === m.key ? 'on' : ''}" data-act="mapTime" data-k="${x.key}">${x.label}</button>`).join('')}</div>
        <button class="btn" data-act="shuffle">Shuffle avatars</button>
      </div>
    </div>
    <p class="small muted" style="margin:6px 0 8px">Showing ${m.label === 'Now' ? 'the current time' : m.label} – ${fmtDate(ms, me.tz)} ${fmtTime(ms, me.tz)} your time. The shaded area is night. Hover an avatar for details; click one to highlight its time-zone band.</p>
    <div class="mapwrap" id="mapwrap">
      <svg viewBox="0 0 ${MAP_W} ${MAP_H}" width="100%" style="display:block;background:#eef4fb;border-radius:8px">
        ${bands}${land}
        <path d="${nightPath(ms)}" fill="rgba(20,30,60,.22)"/>
        ${avatars}
      </svg>
      <div class="maptip" id="maptip"></div>
    </div>
    <div class="team" style="border-top:none;padding-top:0">${groups}</div>
    <p class="small muted" style="margin:6px 0 0">Bands are nominal 15° zones. Real time-zone borders and daylight saving differ (e.g., Melbourne sits in the +10 band but uses AEDT, UTC+11, in summer).</p>
  </div>`;
}
function mapTip(pid){
  const p = person(pid), ms = currentMoment().ms;
  const o = { s:ms, e:ms + STEP_MS };
  return `<b>${p.name}</b>${p.organizer ? ' (organizer)' : ''}<br>${place(p)}<br>
    ${tzName(p.tz, ms)} · ${tzAbbr(p.tz, ms)} (${offsetLabel(p.tz, ms)})<br>
    ${fmtDate(ms, p.tz)} · ${fmtTime(ms, p.tz)} ${isDay(ms, p.tz) ? '☼ day' : '☾ night'}<br>
    <span class="muted">Prefers ${hr(p.pref[0])}–${hr(p.pref[1])}${outsidePref(o, p) ? ' · <span style="color:var(--warn)">⚑ outside</span>' : ''}</span>`;
}
document.addEventListener('pointerover', e => {
  const g = e.target.closest && e.target.closest('[data-avatar]');
  const tip = document.getElementById('maptip');
  if (!tip) return;
  if (!g){ tip.style.display = 'none'; return; }
  const wrap = document.getElementById('mapwrap').getBoundingClientRect(), r = g.getBoundingClientRect();
  tip.innerHTML = mapTip(g.dataset.avatar);
  tip.style.display = 'block';
  tip.style.left = Math.min(r.left - wrap.left + r.width / 2 + 12, wrap.width - 230) + 'px';
  tip.style.top = Math.max(r.top - wrap.top - 10, 0) + 'px';
});
document.addEventListener('click', e => {
  const g = e.target.closest && e.target.closest('[data-avatar]');
  if (!g) return;
  S.mapPin = S.mapPin === g.dataset.avatar ? null : g.dataset.avatar;
  render();
});

refreshCells();
render();
</script>
