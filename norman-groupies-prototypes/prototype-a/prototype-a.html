<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prototype A – Availability-First Scheduling</title><style>
  :root{
    --bg:#f4f5f7; --card:#fff; --line:#dfe1e6; --text:#1f2430; --muted:#6b7280;
    --accent:#2f6fde; --accent-soft:#e8f0fd; --ok:#1f8a4c; --ok-soft:#e6f4ec;
    --warn:#b7791f; --warn-soft:#fdf4e3; --bad:#c0392b; --bad-soft:#fbeaea;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  header h1{font-size:17px;margin:0}
  header .sub{color:var(--muted);font-size:12px}
  .viewas{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .viewas span{color:var(--muted);font-size:12px;margin-right:4px}
  .chipbtn{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 12px;cursor:pointer;font-size:13px}
  .chipbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  main{max-width:1020px;margin:0 auto;padding:20px 24px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
  .card h2{font-size:15px;margin:0 0 10px}
  .card h3{font-size:14px;margin:0 0 6px}
  .muted{color:var(--muted)}
  .small{font-size:12px}

  /* Status bar */
  .status{display:flex;align-items:center;margin:4px 0 10px;flex-wrap:wrap;row-gap:6px}
  .step{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:16px;font-size:12.5px;color:var(--muted);background:#eef0f3;white-space:nowrap}
  .step .dot{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;background:#fff;border:1px solid var(--line)}
  .step.done{color:var(--ok);background:var(--ok-soft)}
  .step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
  .step.current{color:#fff;background:var(--accent);font-weight:600}
  .step.current .dot{background:#fff;color:var(--accent);border-color:#fff}
  .arrow{color:#b8bec9;margin:0 4px}
  .statusmsg{display:inline-block;padding:6px 10px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px}
  .statusmsg.final{background:var(--ok-soft);color:var(--ok)}
  .round{margin-left:8px;font-size:12px;color:var(--muted)}
  .team{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
  .member{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:5px 9px;background:#fafbfc}
  .member b{font-size:12.5px}

  /* Tabs */

  /* Local times */
  .times{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .lt{border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12.5px;background:#fafbfc}
  .lt b{font-weight:600}
  .lt.me{border-color:var(--accent);background:var(--accent-soft)}
  .lt.out{border-color:#e8c26a;background:var(--warn-soft)}
  .flag{color:var(--warn);font-weight:700;margin-left:3px}
  .icon{margin-left:3px}

  /* Slots */
  .slot{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}
  .slot-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .slot-title{font-weight:600}
  .big{font-size:16px;font-weight:600}
  .opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .opt{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;user-select:none}
  .opt input{margin:0}
  .opt.sel-prefer{border-color:var(--ok);background:var(--ok-soft)}
  .opt.sel-inconvenient{border-color:var(--warn);background:var(--warn-soft)}
  .opt.sel-cannot{border-color:var(--bad);background:var(--bad-soft)}
  .opt.disabled{opacity:.45;cursor:not-allowed}
  .nonework{margin-top:6px;border:1px dashed #c9ced8;border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:8px}

  .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .col{border-radius:6px;padding:8px 10px;min-height:56px}
  .col h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
  .col.p{background:var(--ok-soft)} .col.p h4{color:var(--ok)}
  .col.i{background:var(--warn-soft)} .col.i h4{color:var(--warn)}
  .col.c{background:var(--bad-soft)} .col.c h4{color:var(--bad)}
  .name{display:inline-block;background:#fff;border-radius:10px;padding:1px 8px;margin:2px 4px 2px 0;font-size:12.5px;border:1px solid rgba(0,0,0,.06)}

  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  input[type=datetime-local],input[type=date],select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
  button{font:inherit;cursor:pointer}
  .btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 12px}
  .btn:hover{background:#f7f8fa}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(.95)}
  .btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn.link{border:none;background:none;color:var(--accent);padding:4px 6px}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}

  .banner{border-radius:8px;padding:12px 14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .banner.alert{background:var(--warn-soft);border:1px solid #e8c26a}
  .banner.info{background:var(--accent-soft);border:1px solid #bcd1f6}
  .banner.okb{background:var(--ok-soft);border:1px solid #a9d8bc}
  .strike{text-decoration:line-through;color:var(--muted)}
  .error{color:var(--bad);font-size:12.5px;margin-top:6px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
  .sw{display:inline-block;width:14px;height:10px;border:1px solid var(--line);vertical-align:middle;margin-right:4px}
  .log{margin:0;padding-left:18px;font-size:12.5px;color:var(--muted)}
  .log li{margin-bottom:2px}
  .demo{border-style:dashed;background:#fbfbfc}
  .confirmed-box{border:2px solid var(--ok);border-radius:8px;padding:12px 14px;background:var(--ok-soft)}

  /* Date & time setup */
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .seg button{border:none;background:#fff;padding:7px 14px}
  .seg button.on{background:var(--accent);color:#fff}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:12px;color:var(--muted)}
  .setup-grid{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-top:12px}
  .daychips{display:flex;gap:4px}
  .daychip{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 9px;font-size:13px}
  .daychip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

  /* Availability grid */
  .gridwrap{overflow-x:auto;margin-top:8px}
  .grid{display:grid;user-select:none;-webkit-user-select:none;font-size:11.5px}
  .paint{touch-action:none}
  .gh{text-align:center;font-weight:600;padding:4px 2px;font-size:12px;border-bottom:1px solid var(--line)}
  .gh.clickable,.rl.clickable{cursor:pointer}
  .gh.clickable:hover,.rl.clickable:hover{color:var(--accent)}
  .rl{text-align:right;padding-right:8px;color:var(--muted);line-height:1;transform:translateY(-5px);white-space:nowrap}
  .cell{height:18px;border-left:1px solid var(--line);border-bottom:1px dotted #e6e8ec;background:#fff}
  .cell.hour{border-top:1px solid #d4d7dd}
  .paint .cell[data-ms]{cursor:pointer}
  .cell.out{background:repeating-linear-gradient(45deg,#fff,#fff 4px,#f3f4f6 4px,#f3f4f6 8px)}
  .cell.on{background:#58b37f}
  .cell.none{background:#eceef1}
  .cell .pl{position:absolute;left:3px;top:1px;font-size:10px;font-weight:700;color:#fff;background:var(--accent);border-radius:3px;padding:0 3px;line-height:14px}
  .cell.on.out{background:#4ea374}
  .opt-card{border-left:4px solid var(--accent)}
  .mapwrap{position:relative;overflow-x:auto}
  .maptip{display:none;position:absolute;z-index:5;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);width:220px;pointer-events:none}
  .mav:hover rect{stroke:var(--accent)}
  @media (max-width:820px){.cols{grid-template-columns:1fr}}

.availability-grid{display:grid;min-width:540px;gap:1px}.avcell{height:25px;border:1px solid #dfe1e6;font-size:11px;touch-action:none}.avcell:focus-visible{outline:3px solid #2f6fde;z-index:1}.preferred{background:#e6f4ec;color:#176539}.possible{background:#fdf4e3;color:#79500c}.unavailable{background:#eceef1;color:#606773}.preference{border-radius:6px;padding:5px 9px;font-size:12px} .gridwrap{max-height:560px;overflow:auto}.brush{border-width:2px} button:focus-visible{outline:3px solid #2f6fde;outline-offset:2px}
</style></head><body><header><div><h1>Prototype A – Availability-First Scheduling</h1><div class="sub">Medium-fidelity prototype · sample data only · no backend</div></div><div class="viewas" id="viewas"></div></header><main id="app"></main><script>
const PEOPLE = [
{id:'seyed',name:'Seyed',city:'Seattle',country:'USA',tz:'America/Los_Angeles',pref:[8,18],organizer:true},
{id:'ahmed',name:'Ahmed',city:'Melbourne',country:'Australia',tz:'Australia/Melbourne',pref:[9,18]},
{id:'luel',name:'Luel',city:'Washington, DC',country:'USA',tz:'America/New_York',pref:[9,19]}];
const ORGANIZER=PEOPLE[0], SLOT_MIN=30, DAY_START=7, DAY_END=19;
const labels={preferred:'Preferred',possible:'Possible if necessary',unavailable:'Unavailable'};
function fresh(){return {view:'seyed',stage:'setup',start:'2026-12-01',end:'2026-12-03',duration:60,availability:{},submitted:{},brush:'preferred',slots:[],cells:[],chosen:null,confirmed:null,message:''};}
let S=fresh();
const z2 = n => String(n).padStart(2,'0');
const STEP_MS = SLOT_MIN * 60000;
function parts(ms, tz){
  const p = new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(new Date(ms));
  const g = t => +p.find(x => x.type === t).value;
  return { y:g('year'), mo:g('month'), d:g('day'), h:g('hour') % 24, mi:g('minute'), s:g('second') };
}
function offsetMs(ms, tz){ const p = parts(ms, tz); return Date.UTC(p.y,p.mo-1,p.d,p.h,p.mi,p.s) - ms; }
function zonedToUtc(str, tz){
  const [d,t] = str.split('T'); const [y,m,dd] = d.split('-').map(Number); const [h,mi] = t.split(':').map(Number);
  const guess = Date.UTC(y,m-1,dd,h,mi);
  let ms = guess - offsetMs(guess, tz);
  ms = guess - offsetMs(ms, tz);
  return ms;
}
function utcToInput(ms, tz){ const p = parts(ms, tz); return `${p.y}-${z2(p.mo)}-${z2(p.d)}T${z2(p.h)}:${z2(p.mi)}`; }
function fmtDate(ms, tz){ return new Intl.DateTimeFormat('en-US',{timeZone:tz,weekday:'short',month:'short',day:'numeric'}).format(new Date(ms)); }
function fmtTime(ms, tz){ return new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',minute:'2-digit'}).format(new Date(ms)); }
function fmtRange(o, tz){ return `${fmtDate(o.s, tz)} · ${fmtTime(o.s, tz)}–${fmtTime(o.e, tz)}`; }
function localHour(ms, tz){ const p = parts(ms, tz); return p.h + p.mi/60; }
function isDay(ms, tz){ const h = localHour(ms, tz); return h >= DAY_START && h < DAY_END; }
// o = {s, e}; outside if it starts before or ends after the person's preferred hours (local)
function outsidePref(o, p){
  const start = localHour(o.s, p.tz), end = start + (o.e - o.s)/36e5;
  return start < p.pref[0] || end > p.pref[1];
}
function offsetLabel(tz, ms){
  const m = Math.round(offsetMs(ms, tz)/60000), a = Math.abs(m);
  return `UTC${m < 0 ? '−' : '+'}${Math.floor(a/60)}${a % 60 ? ':' + z2(a % 60) : ''}`;
}
function tzName(tz, ms){
  try { return new Intl.DateTimeFormat('en-US',{timeZone:tz,timeZoneName:'long'}).formatToParts(new Date(ms)).find(x => x.type === 'timeZoneName').value; }
  catch(e){ return tz; }
}
const REF_MS = () => (S.slots[0] && S.slots[0].s) || S.cells[0] || zonedToUtc('2026-12-01T12:00', ORGANIZER.tz);
const place = p => `${p.city}, ${p.country}`;
function sunMoon(ms, tz){ return isDay(ms, tz) ? '<span class="icon" title="Daytime">☼</span>' : '<span class="icon" title="Nighttime">☾</span>'; }
function hr(h){ return `${((h + 11) % 12) + 1} ${h < 12 ? 'AM' : 'PM'}`; }
function minLabel(min){ const h = Math.floor(min/60), m = min % 60; return `${((h + 11) % 12) + 1}:${z2(m)} ${h < 12 ? 'AM' : 'PM'}`; }
function flagFor(o, p){
  return outsidePref(o, p) ? `<span class="flag" title="Outside ${p.name}'s preferred hours (${hr(p.pref[0])}–${hr(p.pref[1])})">⚑</span>` : '';
}
// Abbreviation such as PST, EST, AEDT (falls back to a small table where the browser only gives "GMT+11")
const TZ_ABBR = { 'Australia/Melbourne':['AEST','AEDT'], 'Australia/Sydney':['AEST','AEDT'], 'Europe/Berlin':['CET','CEST'],
  'Europe/Paris':['CET','CEST'], 'Europe/London':['GMT','BST'], 'Asia/Tokyo':['JST','JST'], 'Asia/Kolkata':['IST','IST'],
  'Asia/Dubai':['GST','GST'], 'Asia/Yerevan':['AMT','AMT'], 'Africa/Addis_Ababa':['EAT','EAT'] };
function tzAbbr(tz, ms){
  let a = '';
  try { a = new Intl.DateTimeFormat('en-US',{timeZone:tz,timeZoneName:'short'}).formatToParts(new Date(ms)).find(x => x.type === 'timeZoneName').value; } catch(e){}
  if (a && !/^(GMT|UTC)/.test(a)) return a;
  if (TZ_ABBR[tz]){
    const y = new Date(ms).getUTCFullYear(), jan = offsetMs(Date.UTC(y,0,15), tz), jul = offsetMs(Date.UTC(y,6,15), tz);
    return TZ_ABBR[tz][offsetMs(ms, tz) > Math.min(jan, jul) ? 1 : 0];
  }
  return offsetLabel(tz, ms);
}
// People who share a time zone are shown together
function tzGroups(list){
  const m = new Map();
  list.forEach(p => { if (!m.has(p.tz)) m.set(p.tz, []); m.get(p.tz).push(p); });
  return [...m.values()];
}
function groupChip(o, ps, meId){
  const tz = ps[0].tz, outs = ps.filter(p => outsidePref(o, p));
  const cls = ['lt']; if (ps.some(p => p.id === meId)) cls.push('me'); if (outs.length) cls.push('out');
  const places = [...new Set(ps.map(place))].join(' / ');
  const flag = outs.length ? `<span class="flag" title="Outside preferred hours: ${outs.map(p => `${p.name} (${hr(p.pref[0])}–${hr(p.pref[1])})`).join(', ')}">⚑${ps.length > 1 ? ' ' + outs.map(p => p.name).join(', ') : ''}</span>` : '';
  return `<span class="${cls.join(' ')}" title="${tzName(tz, o.s)} (${offsetLabel(tz, o.s)})"><b>${ps.map(p => p.name).join(', ')}</b> · ${places} · ${tzAbbr(tz, o.s)}: ${fmtRange(o, tz)}${sunMoon(o.s, tz)}${flag}</span>`;
}
function chipsFor(o, list, meId){ return tzGroups(list).map(g => groupChip(o, g, meId)).join(''); }
function allChips(o, meId){ return `<div class="times">${chipsFor(o, PEOPLE, meId)}</div>`; }


const person=id=>PEOPLE.find(p=>p.id===id);
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dates(){let a=[],t=Date.parse(S.start+'T00:00:00Z'),end=Date.parse(S.end+'T00:00:00Z');for(;t<=end && a.length<8;t+=86400000)a.push(new Date(t).toISOString().slice(0,10));return a;}
function val(id,t){return S.availability[id]?.[t]||'unavailable';}
function count(){return PEOPLE.filter(p=>S.submitted[p.id]).length;}
function meetingState(id,t){let v=[];for(let k=0;k<S.duration/30;k++)v.push(val(id,t+k*STEP_MS));return v.includes('unavailable')?'unavailable':v.includes('possible')?'possible':'preferred';}
function candidates(){let ds=dates(),first=Date.parse(ds[0]+'T00:00:00Z')-86400000,last=Date.parse(ds[ds.length-1]+'T00:00:00Z')+2*86400000,out=[];
for(let t=first;t<last;t+=STEP_MS){let input=utcToInput(t,ORGANIZER.tz);if(!ds.includes(input.slice(0,10)))continue;let states=PEOPLE.map(p=>meetingState(p.id,t));if(!states.includes('unavailable'))out.push({s:t,e:t+S.duration*60000,states,score:states.filter(x=>x==='preferred').length});}
return out.sort((a,b)=>b.score-a.score||a.s-b.s);}
function status(){let names=['Set up request','Collect availability','Compare options','Confirmed'],idx={setup:0,collecting:1,review:2,confirmed:3}[S.stage];return `<div class="card"><h2>Team Project Sync · ${S.duration} minutes</h2><div class="status">${names.map((n,i)=>`<span class="step ${i===idx?'current':i<idx?'done':''}"><span class="dot">${i+1}</span>${n}</span>`).join('<span class="arrow">→</span>')}</div><span class="statusmsg ${S.confirmed?'final':''}">${S.confirmed?'Confirmed – Final':S.stage==='setup'?'Availability request – Not Sent':`Availability submitted (${count()}/${PEOPLE.length}) – Not Final`}</span><div class="team">${PEOPLE.map(p=>`<span class="member"><b>${p.name}${p.organizer?' (organizer)':''}</b> · ${place(p)}<br><span class="muted">Prefers ${hr(p.pref[0])}–${hr(p.pref[1])}</span></span>`).join('')}</div></div>`;}
function setup(){return `<div class="card"><h2>Request team availability</h2><p class="muted">Collect availability before choosing a meeting time. Everyone marks their own local times as preferred, possible if necessary, or unavailable.</p><div class="setup-grid"><div class="field"><label for="start">From date (Seattle)</label><input id="start" type="date" value="${S.start}"></div><div class="field"><label for="end">To date (Seattle)</label><input id="end" type="date" value="${S.end}"></div><div class="field"><label for="duration">Meeting duration</label><select id="duration">${[30,60,90,120].map(d=>`<option ${d===S.duration?'selected':''}>${d}</option>`).join('')}</select></div></div><p class="small muted">Choose up to 7 days. Participant grids include neighboring dates to account for time-zone differences.</p><div class="actions"><button class="btn primary" data-act="start">Send availability request</button></div></div>`;}
function localDates(p){let ds=dates(),a=zonedToUtc(ds[0]+'T00:00',ORGANIZER.tz),z=zonedToUtc(ds[ds.length-1]+'T23:30',ORGANIZER.tz),lo=utcToInput(a,p.tz).slice(0,10),hi=utcToInput(z,p.tz).slice(0,10),out=[];for(let t=Date.parse(lo+'T00:00Z');t<=Date.parse(hi+'T00:00Z');t+=86400000)out.push(new Date(t).toISOString().slice(0,10));return out;}
function availability(p){let ds=localDates(p),h=`<div class="card"><h2>${p.name}'s availability</h2><p class="muted small">Dates and times below are local to ${place(p)} (${p.tz}). Each cell is 30 minutes. Unmarked cells are unavailable. Click cells or drag to paint; keyboard users can focus a cell and press Enter or Space.</p><div class="actions" style="margin-bottom:12px">${Object.entries(labels).map(([k,v])=>`<button class="btn brush ${S.brush===k?'primary':''}" data-act="brush" data-key="${k}" aria-pressed="${S.brush===k}">${v}</button>`).join('')}<button class="btn" data-act="clear">Clear my grid</button></div><div class="gridwrap"><div class="availability-grid" style="grid-template-columns:72px repeat(${ds.length},minmax(90px,1fr))"><div></div>${ds.map(d=>`<div class="gh">${esc(d)}</div>`).join('')}`;
for(let m=0;m<1440;m+=30){h+=`<div class="rl" style="transform:none;padding-top:4px">${minLabel(m)}</div>`;for(let d of ds){let t=zonedToUtc(d+'T'+z2(Math.floor(m/60))+':'+z2(m%60),p.tz),v=val(p.id,t);h+=`<button class="avcell ${v}" data-time="${t}" aria-label="${d} ${minLabel(m)}: ${labels[v]}" title="${d} ${minLabel(m)}: ${labels[v]}">${v==='preferred'?'P':v==='possible'?'~':'–'}</button>`;}}
return h+`</div></div><div class="actions"><button class="btn primary" data-act="submit">${S.submitted[p.id]?'Update availability':'Submit availability'}</button><span class="small muted">${S.submitted[p.id]?'Submitted. Editing marks your response as a draft until submitted again.':'Draft – not submitted'}</span></div></div>`;}
function summary(){return `<div class="card"><h2>Team responses</h2>${PEOPLE.map(p=>`<div class="row" style="margin:8px 0"><span style="min-width:90px">${p.name}</span><span class="muted">${S.submitted[p.id]?'Submitted':'Waiting for availability'}</span></div>`).join('')}<div class="actions"><button class="btn primary" data-act="review" ${count()===3?'':'disabled'}>Compare meeting options</button></div><p class="small muted">All three responses are required before comparing. You can also enter your own availability below.</p></div>`;}
function review(){let cs=candidates(),visible=cs.slice(0,40);return `<div class="card"><h2>Compare available meeting times</h2><p class="muted small">Only times that all three people marked preferred or possible are shown. Options are ranked by the number who marked the full meeting preferred, then by earliest start. This is a transparent prototype rule, not a validated fairness score. Adjacent options may overlap.</p><p class="small">Preferred = green; possible if necessary = amber. Local-hour flags use the sample preferred hours and may differ from explicitly marked availability.</p>${cs.length?`<p class="small muted">${cs.length} matching start times${cs.length>40?' · Showing the first 40':''}.</p>`:`<div class="banner alert"><span>No workable overlap for this duration. Ask participants to revise availability, or reset the request to try a shorter meeting. No meeting has been confirmed.</span></div>`}${visible.map(o=>`<div class="slot"><div class="slot-head"><span class="big">${fmtRange(o,ORGANIZER.tz)} (Seattle)</span><span>${o.score}/3 preferred</span></div>${allChips(o,S.view)}<div class="row">${PEOPLE.map((p,i)=>`<span class="preference ${o.states[i]}">${p.name}: ${labels[o.states[i]]}</span>`).join('')}</div><div class="actions"><button class="btn ${S.chosen===o.s?'primary':''}" data-act="choose" data-time="${o.s}">${S.chosen===o.s?'Selected':'Select this time'}</button></div></div>`).join('')}<div class="actions"><button class="btn" data-act="back">Return to availability</button></div></div>${selectedPanel(cs)}`;}
function selectedPanel(cs){let o=cs.find(x=>x.s===S.chosen);if(!o)return '';return `<div class="card"><h2>Review before confirmation</h2>${allChips(o,S.view)}${o.score<3?'<div class="banner alert">This time is possible but not preferred for at least one person. Availability does not necessarily mean convenience.</div>':''}<p class="small muted">The organizer's confirmation makes this time final. No real invitations or notifications are sent.</p><button class="btn ok" data-act="confirm">Confirm meeting</button></div>`;}
function confirmed(){return `<div class="card"><h2>Meeting confirmed</h2><div class="confirmed-box"><div class="big">${fmtRange(S.confirmed,person(S.view).tz)}</div><p class="small">Your local time · ${place(person(S.view))}</p>${allChips(S.confirmed,S.view)}</div><p class="small muted">Confirmed by ${ORGANIZER.name}. Sample data only; no calendar invitation was sent.</p></div>`;}
function render(){document.getElementById('viewas').innerHTML='<span>View as:</span>'+PEOPLE.map(p=>`<button class="chipbtn ${p.id===S.view?'on':''}" data-act="view" data-id="${p.id}">${p.name}${p.organizer?' (Organizer)':''}</button>`).join('');let p=person(S.view),h=status();if(S.message)h+=`<div role="status" class="banner info">${esc(S.message)}</div>`;
if(S.stage==='setup')h+=p.organizer?setup():'<div class="card">Waiting for the organizer to request availability.</div>';
else if(S.confirmed)h+=confirmed();else if(S.stage==='review')h+=p.organizer?review():'<div class="card">The organizer is comparing available times. The meeting is not final.</div><div class="actions"><button class="btn" data-act="back">Edit availability</button></div>';
else h+=(p.organizer?summary():'')+availability(p);
h+=`<div class="card demo"><h3>Prototype controls</h3><p class="small muted">Not part of the design. Everything is simulated in this browser tab. Reloading resets the prototype. Sample availability intentionally includes compromise options.</p><div class="actions"><button class="btn" data-act="sample" ${S.stage==='setup'||S.confirmed?'disabled':''}>Fill sample availability for everyone</button><button class="btn" data-act="reset">Reset prototype</button></div></div>`;document.getElementById('app').innerHTML=h;}
function paint(button){if(!button?.dataset.time)return;let id=S.view,t=button.dataset.time;if(!S.availability[id])S.availability[id]={};S.availability[id][t]=S.brush;S.submitted[id]=false;button.className='avcell '+S.brush;button.textContent=S.brush==='preferred'?'P':S.brush==='possible'?'~':'–';button.setAttribute('aria-label',utcToInput(+t,person(id).tz)+' '+labels[S.brush]);button.title=button.getAttribute('aria-label');}
let painting=false;
document.addEventListener('pointerdown',e=>{let c=e.target.closest('.avcell');if(c&&e.button===0){e.preventDefault();painting=true;paint(c);}});
document.addEventListener('pointermove',e=>{if(painting)paint(document.elementFromPoint(e.clientX,e.clientY)?.closest('.avcell'));});
document.addEventListener('pointerup',()=>{if(painting){painting=false;render();}});
document.addEventListener('pointercancel',()=>{painting=false;render();});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.avcell')){e.preventDefault();paint(e.target);}});
document.addEventListener('click',e=>{let el=e.target.closest('[data-act]');if(!el||el.disabled)return;let a=el.dataset.act;S.message='';if(a==='view')S.view=el.dataset.id;
if(a==='brush')S.brush=el.dataset.key;
if(a==='start'){let st=document.getElementById('start').value,en=document.getElementById('end').value,diff=(Date.parse(en)-Date.parse(st))/86400000;if(!st||!en||!Number.isFinite(diff)||diff<0||diff>6){S.message='Choose a valid date range of 1–7 days.';}else{S.start=st;S.end=en;S.duration=+document.getElementById('duration').value;S.stage='collecting';}}
if(a==='clear'){S.availability[S.view]={};S.submitted[S.view]=false;}
if(a==='submit'){S.submitted[S.view]=true;S.message='Availability submitted for '+person(S.view).name+'.';}
if(a==='review'){S.stage='review';S.chosen=null;}
if(a==='back'){S.stage='collecting';S.chosen=null;}
if(a==='choose')S.chosen=+el.dataset.time;
if(a==='confirm'){let o=candidates().find(o=>o.s===S.chosen);if(o){S.confirmed=o;S.stage='confirmed';}}
if(a==='sample'){S.availability={};let ds=dates(),lo=Date.parse(ds[0]+'T00:00Z')-86400000,hi=Date.parse(ds[ds.length-1]+'T00:00Z')+2*86400000;PEOPLE.forEach(p=>{S.availability[p.id]={};for(let t=lo;t<hi;t+=STEP_MS){let h=localHour(t,p.tz);S.availability[p.id][t]=h>=p.pref[0]&&h<p.pref[1]?'preferred':h>=6&&h<23?'possible':'unavailable';}S.submitted[p.id]=true;});S.stage='collecting';S.message='Sample availability loaded. Switch views to inspect it, or compare options as organizer.';}
if(a==='reset')S=fresh();render();});
render();
</script></body></html>
